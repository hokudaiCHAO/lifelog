<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>LifeLog</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="container">


        <!-- =================================================
             標題
        ================================================== -->

        <header>

            <h1>LifeLog</h1>

            <p class="subtitle">
                記錄生活
            </p>

        </header>

        <!-- =================================================
             主功能分頁
        ================================================== -->

        <nav
            class="main-tabs"
            aria-label="LifeLog 主功能"
        >

            <button
                type="button"
                class="main-tab active"
                data-page="record"
            >
                新增紀錄
            </button>

            <button
                type="button"
                class="main-tab"
                data-page="statistics"
            >
                統計
            </button>

            

            <button
                type="button"
                class="main-tab"
                data-page="search"
            >
                搜尋
            </button>

        </nav>

        <!-- =================================================
             新增／編輯紀錄
        ================================================== -->

                <section
            class="card app-page"
            data-page-content="record"
        >

            <h2 id="form-title">
                新增紀錄
            </h2>


            <!-- 日期 -->

            <div class="form-group">

                <label for="date">
                    日期
                </label>

                <input
                    type="date"
                    id="date"
                >

            </div>


            <!-- 紀錄 -->

<div class="form-group">

    <label for="title">
        紀錄
    </label>

    <input
        type="text"
        id="title"
        list="event-options"
        placeholder="例如：收支、影視、閱讀"
        autocomplete="off"
    >

    <datalist id="event-options">

        <option value="收支">
        <option value="影視">
        <option value="閱讀">
        <option value="醫療">
        <option value="購物">
        <option value="旅行">
        <option value="工作">
        <option value="其他">

    </datalist>

</div>


            <!-- 收支 -->

            <div class="form-group">

                <label>
                    收支
                </label>

                <div class="radio-group">

                    <div class="radio-option">

                        <input
                            type="radio"
                            id="transaction-none"
                            name="transaction"
                            value="無"
                            checked
                        >

                        <label for="transaction-none">
                            無
                        </label>

                    </div>


                    <div class="radio-option">

                        <input
                            type="radio"
                            id="transaction-expense"
                            name="transaction"
                            value="支出"
                        >

                        <label for="transaction-expense">
                            支出
                        </label>

                    </div>


                    <div class="radio-option">

                        <input
                            type="radio"
                            id="transaction-income"
                            name="transaction"
                            value="收入"
                        >

                        <label for="transaction-income">
                            收入
                        </label>

                    </div>

                </div>

            </div>


            <!-- 金額 -->

            <div class="form-group">

                <label for="amount">
                    金額
                </label>

                <input
                    type="number"
                    id="amount"
                    min="0"
                    step="1"
                    inputmode="decimal"
                    placeholder="0"
                >

            </div>


            <!-- 標籤 -->

            <div class="form-group">

                <label for="tags">
                    標籤
                </label>

                <input
                    type="text"
                    id="tags"
                    placeholder="例如：交通, 高雄, 家人"
                >

            </div>



            <!-- =================================================
                 更多資料
            ================================================== -->

            <details
                id="more-fields"
                class="more-fields"
            >

                <summary>
                    更多資料
                </summary>


                <!-- 結束日期 -->

                <div class="form-group">

                    <label for="end-date">
                        結束日期
                    </label>

                    <input
                        type="date"
                        id="end-date"
                    >

                </div>


                <!-- 作品年份 -->

                <div class="form-group">

                    <label for="work-year">
                        作品年份
                    </label>

                    <input
                        type="number"
                        id="work-year"
                        min="0"
                        max="2100"
                        step="1"
                        placeholder="例如：2026"
                    >

                </div>


                <!-- 備註 -->

                <div class="form-group">

                    <label for="description">
                        備註
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="其他想記下來的內容"
                    ></textarea>

                </div>

            </details>



            <!-- 儲存 -->

            <button
                type="button"
                id="save-button"
                class="save-button"
            >
                儲存
            </button>


            <!-- 取消編輯 -->

            <button
                type="button"
                id="cancel-button"
                class="cancel-button"
                hidden
            >
                取消編輯
            </button>


            <p
                id="message"
                class="message"
            ></p>

        </section>



        <!-- =================================================
             統計
        ================================================== -->

                <section
            class="card statistics-card app-page"
            data-page-content="statistics"
            hidden
        >

            <h2>
                統計
            </h2>


            <!-- 統計期間 -->

            <div class="form-group">

                <label for="statistics-period">
                    期間
                </label>

                <select id="statistics-period">

                    <option value="all">
                        全部
                    </option>

                    <option
                        value="year"
                        selected
                    >
                        今年
                    </option>

                    <option value="month">
                        本月
                    </option>

                    <option value="history">
                        指定年份／月份
                    </option>

                    <option value="custom">
                        自訂日期
                    </option>

                </select>

            </div>



            <!-- =================================================
                 指定年份／月份
            ================================================== -->

            <div
                id="history-statistics-period"
                hidden
            >

                <div class="form-group">

                    <label for="statistics-year">
                        年份
                    </label>

                    <select id="statistics-year">
                    </select>

                </div>


                <div class="form-group">

                    <label for="statistics-month">
                        月份
                    </label>

                    <select id="statistics-month">

                        <option
                            value="all"
                            selected
                        >
                            全年
                        </option>

                        <option value="01">1 月</option>
                        <option value="02">2 月</option>
                        <option value="03">3 月</option>
                        <option value="04">4 月</option>
                        <option value="05">5 月</option>
                        <option value="06">6 月</option>
                        <option value="07">7 月</option>
                        <option value="08">8 月</option>
                        <option value="09">9 月</option>
                        <option value="10">10 月</option>
                        <option value="11">11 月</option>
                        <option value="12">12 月</option>

                    </select>

                </div>

            </div>



            <!-- =================================================
                 自訂日期
            ================================================== -->

            <div
                id="custom-statistics-period"
                hidden
            >

                <div class="form-group">

                    <label for="statistics-start-date">
                        開始日期
                    </label>

                    <input
                        type="date"
                        id="statistics-start-date"
                    >

                </div>


                <div class="form-group">

                    <label for="statistics-end-date">
                        結束日期
                    </label>

                    <input
                        type="date"
                        id="statistics-end-date"
                    >

                </div>

            </div>

            <!-- =================================================
                 紀錄篩選
            ================================================== -->

            <div class="statistics-filter-section">

                <div class="statistics-filter-title">
                    紀錄
                </div>

                <div
                    id="statistics-record-filters"
                    class="statistics-filter-buttons"
                >

                    <button
                        type="button"
                        class="statistics-filter-button active"
                        data-record-filter="all"
                    >
                        全部
                    </button>

                    <button
                        type="button"
                        class="statistics-filter-button"
                        data-record-filter="收支"
                    >
                        收支
                    </button>

                    <button
                        type="button"
                        class="statistics-filter-button"
                        data-record-filter="影視"
                    >
                        影視
                    </button>

                    <button
                        type="button"
                        class="statistics-filter-button"
                        data-record-filter="閱讀"
                    >
                        閱讀
                    </button>

                    <button
                        type="button"
                        class="statistics-filter-button"
                        data-record-filter="醫療"
                    >
                        醫療
                    </button>

                    <button
                        type="button"
                        class="statistics-filter-button"
                        data-record-filter="購物"
                    >
                        購物
                    </button>

                    <button
                        type="button"
                        class="statistics-filter-button"
                        data-record-filter="旅行"
                    >
                        旅行
                    </button>

                    <button
                        type="button"
                        class="statistics-filter-button"
                        data-record-filter="工作"
                    >
                        工作
                    </button>

                    <button
                        type="button"
                        class="statistics-filter-button"
                        data-record-filter="其他"
                    >
                        其他
                    </button>

                </div>

            </div>


            <!-- =================================================
                 標籤篩選
            ================================================== -->

            <div class="statistics-filter-section">

                <div class="statistics-filter-title">
                    標籤
                </div>

                <div
                    id="statistics-tag-filters"
                    class="statistics-filter-buttons"
                >

                    <button
                        type="button"
                        class="statistics-filter-button active"
                        data-tag-filter="all"
                    >
                        全部
                    </button>

                </div>

            </div>


            <!-- =================================================
                 摘要
            ================================================== -->

<h3
    id="statistics-summary-title"
    class="statistics-summary-title"
>
    年度摘要
</h3>

<div
    id="statistics-filter-summary"
    class="statistics-filter-summary"
>
    全部紀錄 · 全部標籤
</div>

            <div class="statistics-summary">

                <div class="statistics-item">

                    <span class="statistics-label">
                        紀錄
                    </span>

                    <strong id="statistics-count">
                        0 筆
                    </strong>

                </div>


                <div class="statistics-item">

                    <span class="statistics-label">
                        支出
                    </span>

                    <strong id="statistics-expense">
                        NT$ 0
                    </strong>

                </div>


                <div class="statistics-item">

                    <span class="statistics-label">
                        收入
                    </span>

                    <strong id="statistics-income">
                        NT$ 0
                    </strong>

                </div>


                <div class="statistics-item">

                    <span class="statistics-label">
                        結餘
                    </span>

                    <strong id="statistics-balance">
                        NT$ 0
                    </strong>

                </div>

            </div>



            <!-- =================================================
     紀錄統計
================================================== -->

<div class="statistics-section">

    <h3>
        紀錄
    </h3>

    <div id="event-statistics">

        <p class="empty-message">
            目前沒有資料。
        </p>

    </div>

</div>



            <!-- =================================================
                 標籤統計
            ================================================== -->

            <div class="statistics-section">

                <h3>
                    標籤
                </h3>

                <div id="tag-statistics">

                    <p class="empty-message">
                        目前沒有資料。
                    </p>

                </div>

            </div>

        </section>

        <!-- =================================================
             圖表統計
        ================================================== -->

                <section
            class="card app-page"
            data-page-content="charts"
            hidden
        >

            <h2>
                圖表
            </h2>


            <!-- 每月支出趨勢 -->

            <div class="statistics-section">

                <h3>
                    每月支出趨勢
                </h3>

                <div
                    id="monthly-expense-chart"
                    class="chart-container"
                >

                    <p class="empty-message">
                        目前沒有資料。
                    </p>

                </div>

            </div>


            <!-- 紀錄次數排行 -->

<div class="statistics-section">

    <h3>
        紀錄次數排行
    </h3>

    <div
        id="event-ranking-chart"
        class="chart-container"
    >

        <p class="empty-message">
            目前沒有資料。
        </p>

    </div>

</div>

        </section>

        <!-- =================================================
             搜尋紀錄
        ================================================== -->

                <section
            class="card app-page"
            data-page-content="search"
            hidden
        >

            <h2>
                搜尋紀錄
            </h2>

            <div class="form-group">

                <label for="search-input">
                    關鍵字
                </label>

                <input
                    type="search"
                    id="search-input"
                    placeholder="搜尋紀錄、標籤或備註"
                    autocomplete="off"
                >

            </div>

            
            <div id="search-results">

                <p class="empty-message">
                    輸入關鍵字開始搜尋。
                </p>

            </div>

        </section>



        <!-- =================================================
             最近紀錄
        ================================================== -->

                <section
            class="card records-card app-page"
            data-page-content="record"
        >

                                   <button
                type="button"
                id="export-button"
                class="export-button"
            >
                匯出備份
            </button>

<button
    type="button"
    id="import-button"
    class="export-button"
>
    匯入備份
</button>

<input
    type="file"
    id="import-file"
    accept=".json,application/json"
    hidden
>

            <h2>
                最近紀錄
            </h2>

            <div id="records">

                <p class="empty-message">
                    目前還沒有紀錄。
                </p>

            </div>

        </section>


    </main>



    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script src="database.js"></script>

    <script src="app.js"></script>


</body>

</html>
